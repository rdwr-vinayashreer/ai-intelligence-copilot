name: AI Intelligence

on:
  # Allows us to run the workflow manually whenever we want
  workflow_dispatch:

  # Temporary test schedule: every 5 minutes
  schedule:
    - cron: '*/5 * * * *'
      timezone: "Asia/Kolkata"

permissions:
  contents: read
  copilot-requests: write

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run AI Intelligence agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            --agent=ai-intelligence \
            --prompt="Research the most significant AI developments from the last 24 hours. Follow all instructions in the AI Intelligence custom agent. Produce the final daily AI intelligence briefing. Do not modify repository files. Output only the final briefing, with no progress messages, planning messages, or commentary before or after the briefing." \
            --silent \
            --allow-all-tools \
            --allow-all-urls \
            --no-ask-user \
            > ai-intelligence-briefing.raw.md

      - name: Clean briefing output
        run: |
          if grep -q '^# 🤖 AI Intelligence Briefing' ai-intelligence-briefing.raw.md; then
            sed -n '/^# 🤖 AI Intelligence Briefing/,$p' \
              ai-intelligence-briefing.raw.md \
              > ai-intelligence-briefing.md
          else
            cp ai-intelligence-briefing.raw.md ai-intelligence-briefing.md
          fi

      - name: Add briefing to workflow summary
        run: |
          cat ai-intelligence-briefing.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-intelligence-briefing
          path: ai-intelligence-briefing.md

      - name: Send briefing by Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import smtplib
          import html as html_lib
          from email.message import EmailMessage
          from pathlib import Path

          username = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]

          markdown = Path("ai-intelligence-briefing.md").read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # Markdown → HTML
          # ---------------------------------------------------------

          def inline_format(text):
              text = html_lib.escape(text)

              # Markdown links: [text](url)
              text = re.sub(
                  r'\[([^\]]+)\]\((https?://[^)]+)\)',
                  r'<a href="\2">\1</a>',
                  text
              )

              # Bold
              text = re.sub(
                  r'\*\*(.+?)\*\*',
                  r'<strong>\1</strong>',
                  text
              )

              # Italic
              text = re.sub(
                  r'(?<!\*)\*([^*]+)\*(?!\*)',
                  r'<em>\1</em>',
                  text
              )

              # Inline code
              text = re.sub(
                  r'`([^`]+)`',
                  r'<code>\1</code>',
                  text
              )

              return text

          lines = markdown.splitlines()

          body = []
          in_ul = False
          in_ol = False
          in_code = False
          code_lines = []

          def close_lists():
              nonlocal in_ul, in_ol

              if in_ul:
                  body.append("</ul>")
                  in_ul = False

              if in_ol:
                  body.append("</ol>")
                  in_ol = False

          for line in lines:
              stripped = line.strip()

              # Skip main Markdown title.
              if stripped.startswith("# 🤖 AI Intelligence Briefing"):
                  continue

              # Skip metadata because it is displayed in the email header.
              if stripped.startswith("**Date:**"):
                  continue

              if stripped.startswith("**Research window:**"):
                  continue

              # Code blocks
              if stripped.startswith("```"):
                  if not in_code:
                      close_lists()
                      in_code = True
                      code_lines = []
                  else:
                      in_code = False
                      body.append(
                          "<pre><code>"
                          + html_lib.escape("\n".join(code_lines))
                          + "</code></pre>"
                      )
                  continue

              if in_code:
                  code_lines.append(line)
                  continue

              # Horizontal rule
              if re.match(r"^-{3,}$", stripped):
                  close_lists()
                  body.append("<hr>")
                  continue

              # H2
              if stripped.startswith("## "):
                  close_lists()
                  heading = stripped[3:]
                  body.append(
                      f"<h2>{inline_format(heading)}</h2>"
                  )
                  continue

              # H3
              if stripped.startswith("### "):
                  close_lists()
                  heading = stripped[4:]
                  body.append(
                      f"<h3>{inline_format(heading)}</h3>"
                  )
                  continue

              # H4
              if stripped.startswith("#### "):
                  close_lists()
                  heading = stripped[5:]
                  body.append(
                      f"<h4>{inline_format(heading)}</h4>"
                  )
                  continue

              # Blockquote
              if stripped.startswith("> "):
                  close_lists()
                  quote = stripped[2:]
                  body.append(
                      f"<blockquote>{inline_format(quote)}</blockquote>"
                  )
                  continue

              # Bullet list
              if stripped.startswith("- "):
                  if not in_ul:
                      close_lists()
                      body.append("<ul>")
                      in_ul = True

                  body.append(
                      f"<li>{inline_format(stripped[2:])}</li>"
                  )
                  continue

              # Numbered list
              numbered = re.match(r"^(\d+)\.\s+(.*)$", stripped)

              if numbered:
                  if not in_ol:
                      close_lists()
                      body.append("<ol>")
                      in_ol = True

                  body.append(
                      f"<li>{inline_format(numbered.group(2))}</li>"
                  )
                  continue

              # Empty line
              if not stripped:
                  close_lists()
                  continue

              close_lists()

              body.append(
                  f"<p>{inline_format(stripped)}</p>"
              )

          close_lists()

          content_html = "\n".join(body)

          # ---------------------------------------------------------
          # Extract date from briefing
          # ---------------------------------------------------------

          date_match = re.search(
              r"\*\*Date:\*\*\s*(.+)",
              markdown
          )

          briefing_date = (
              date_match.group(1).strip()
              if date_match
              else "Daily Briefing"
          )

          # ---------------------------------------------------------
          # Build polished HTML email
          # ---------------------------------------------------------

          email_html = f"""<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <style>
              body {{
                margin: 0;
                padding: 0;
                background: #f4f6f8;
                font-family: Arial, Helvetica, sans-serif;
                color: #1f2937;
                line-height: 1.6;
              }}

              .wrapper {{
                width: 100%;
                padding: 30px 0;
              }}

              .container {{
                max-width: 760px;
                margin: 0 auto;
                background: #ffffff;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
              }}

              .header {{
                padding: 28px 32px;
                background: #111827;
                color: #ffffff;
              }}

              .header h1 {{
                margin: 0;
                font-size: 26px;
                font-weight: 700;
              }}

              .header p {{
                margin: 6px 0 0;
                color: #d1d5db;
                font-size: 14px;
              }}

              .intro {{
                padding: 20px 32px;
                background: #f9fafb;
                border-bottom: 1px solid #e5e7eb;
                font-size: 14px;
                color: #4b5563;
              }}

              .content {{
                padding: 28px 32px;
              }}

              h2 {{
                margin-top: 30px;
                padding-bottom: 8px;
                border-bottom: 2px solid #e5e7eb;
                font-size: 20px;
                color: #111827;
              }}

              h3 {{
                margin-top: 24px;
                font-size: 17px;
                color: #111827;
              }}

              h4 {{
                font-size: 15px;
                color: #374151;
              }}

              p {{
                margin: 10px 0;
                font-size: 14px;
              }}

              ul,
              ol {{
                padding-left: 24px;
                font-size: 14px;
              }}

              li {{
                margin: 6px 0;
              }}

              blockquote {{
                margin: 18px 0;
                padding: 12px 16px;
                border-left: 4px solid #6b7280;
                background: #f9fafb;
                color: #4b5563;
              }}

              a {{
                color: #2563eb;
                text-decoration: none;
              }}

              a:hover {{
                text-decoration: underline;
              }}

              code {{
                background: #f3f4f6;
                padding: 2px 5px;
                border-radius: 4px;
                font-family: monospace;
                font-size: 13px;
              }}

              pre {{
                background: #111827;
                color: #f9fafb;
                padding: 16px;
                border-radius: 8px;
                overflow-x: auto;
                font-size: 12px;
              }}

              hr {{
                border: 0;
                border-top: 1px solid #e5e7eb;
                margin: 26px 0;
              }}

              .footer {{
                padding: 18px 32px;
                background: #f9fafb;
                border-top: 1px solid #e5e7eb;
                color: #6b7280;
                font-size: 12px;
                text-align: center;
              }}

              @media only screen and (max-width: 600px) {{
                .wrapper {{
                  padding: 0;
                }}

                .container {{
                  border-radius: 0;
                }}

                .header,
                .intro,
                .content,
                .footer {{
                  padding-left: 20px;
                  padding-right: 20px;
                }}

                .header h1 {{
                  font-size: 22px;
                }}
              }}
            </style>
          </head>

          <body>
            <div class="wrapper">
              <div class="container">

                <div class="header">
                  <h1>🤖 AI Intelligence Briefing</h1>
                  <p>{html_lib.escape(briefing_date)}</p>
                </div>

                <div class="intro">
                  Your daily snapshot of significant AI developments,
                  research, engineering trends, security developments,
                  and enterprise AI activity.
                </div>

                <div class="content">
                  {content_html}
                </div>

                <div class="footer">
                  Generated automatically by the AI Intelligence Agent.
                  <br>
                  Sources are included throughout the briefing.
                </div>

              </div>
            </div>
          </body>
          </html>
          """

          # ---------------------------------------------------------
          # Plain-text fallback
          # ---------------------------------------------------------

          plain_text = markdown

          # ---------------------------------------------------------
          # Send email
          # ---------------------------------------------------------

          msg = EmailMessage()

          msg["Subject"] = (
              f"🤖 AI Intelligence Briefing — {briefing_date}"
          )

          msg["From"] = username
          msg["To"] = username

          msg.set_content(plain_text)
          msg.add_alternative(email_html, subtype="html")

          with smtplib.SMTP("smtp.gmail.com", 587) as smtp:
              smtp.starttls()
              smtp.login(username, password)
              smtp.send_message(msg)

          print(
              "Beautiful HTML AI Intelligence briefing sent successfully."
          )
          PY
