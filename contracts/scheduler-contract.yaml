version: "1.0"

name: ai-intelligence-scheduler-contract

description: >
  Standard contract between an external scheduler and the AI Intelligence
  execution runtime.

request:
  required:
    - user_config
    - trigger

  user_config:
    type: string
    description: >
      Repository-relative path to the user configuration that defines the
      user's profile, topics, schedule, and delivery settings.
    example: config/users/example.yaml

  trigger:
    type: string
    allowed:
      - scheduled
      - manual
      - retry
      - event

  optional:
    - requested_at
    - correlation_id
    - trigger_source

  requested_at:
    type: string
    format: date-time
    description: >
      Timestamp indicating when the scheduler requested the execution.

  trigger_source:
    type: string
    description: >
      Identifies the system or mechanism that initiated the run.
    examples:
      - n8n-scheduler
      - manual
      - retry
      - event

  correlation_id:
    type: string
    description: >
      Identifier used to correlate the scheduler request with the complete
      execution and delivery lifecycle.

response:
  required:
    - accepted
    - run_id

  accepted:
    type: boolean
    description: >
      Indicates whether the runtime accepted the execution request.

  run_id:
    type: string
    description: >
      Unique identifier assigned to the runtime execution.

scheduler_adapters:
  current:
    - n8n

  compatible:
    - github_actions
    - jenkins
    - cron
    - kubernetes
    - enterprise_scheduler

principles:
  - Schedulers trigger runs; they do not perform intelligence work.
  - Scheduler implementations must not contain research or delivery logic.
  - The user configuration must be passed explicitly to the runtime.
  - A scheduler must receive or be able to correlate a run ID.
  - Every externally triggered run should identify its trigger source.
  - Only one production scheduler should own the recurring schedule.
