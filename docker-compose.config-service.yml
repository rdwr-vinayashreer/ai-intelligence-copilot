services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-intelligence-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ai_intelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_intelligence_dev}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-ai_intelligence} -d $${POSTGRES_DB:-ai_intelligence}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  config-service:
    build:
      context: .
      dockerfile: services/config_service/Dockerfile

    container_name: ai-intelligence-config-service
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_intelligence}:${POSTGRES_PASSWORD:-ai_intelligence_dev}@postgres:5432/${POSTGRES_DB:-ai_intelligence}
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-local-scheduler-dev-key}
      AUTH_USER_HEADER: X-Authenticated-User
volumes:
  postgres-data: